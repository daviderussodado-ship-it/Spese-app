<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aggiornamento Spese</title></head>
<body style="font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;padding:28px;max-width:560px;margin:auto">
<h2>🔄 Aggiornamento Spese</h2><p id="status">Pulizia della cache dell’app in corso…</p>
<script>
(async()=>{
  try{
    if('caches' in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('spese-pwa-')).map(k=>caches.delete(k)));}
    if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();for(const reg of regs){if(reg.scope.includes('/Spese-app/')) await reg.unregister();}}
    document.getElementById('status').textContent='Cache aggiornata. Riapro l’app…';
    setTimeout(()=>location.replace('./?refresh='+Date.now()),500);
  }catch(e){document.getElementById('status').textContent='Apri di nuovo questa pagina oppure torna alla Home dell’app.';}
})();
</script></body></html>
